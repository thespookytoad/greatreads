<!doctype html>

<html lang="en">
  <head>
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap"
      rel="stylesheet"/>
    <link href="/static/styles.css" rel="stylesheet" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
      rel="stylesheet"/>
    <title>GreatReads</title>
  </head>
  <body>
    <nav class="bg-light border navbar navbar-expand-md navbar-light">
        <div class="collapse navbar-collapse" id="navbar">
          <img src="static/GRLogov1.png" alt="Logo" class="logo">
          {% if session["user_id"] %}
            <ul class="navbar-nav me-auto mt-2">
              <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
              <li class="nav-item"><a class="nav-link" href="/stats">Statistics</a></li>
            </ul>
            <ul class="navbar-nav">
              <li class="nav-item"><a class="nav-link right" href="/logout">Log Out</a></li>
            </ul>
          {% else %}
            <ul class="navbar-nav ms-auto mt-2">
              <li class="nav-item"><a class="nav-link" href="/register">Register</a></li>
              <li class="nav-item"><a class="nav-link" href="/login">Log In</a></li>
            </ul>
          {% endif %}
        </div>
      </div>
    </nav>
    <main>{% block main %}{% endblock %}</main>
    <footer>
      <button onclick="runDarkness()">Dark mode</button>
    </footer>
    <script>
      function runDarkness() {
        var element = document.body;
        element.classList.toggle("dark-mode");
      }
    </script>
  </body>
</html>
